name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A3C24F: ${{ secrets.A3C24F }}
          B1E49E: ${{ secrets.B1E49E }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A3C24F', '')
          env_b = os.environ.get('B1E49E', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- caf7a9ab04480d410a05 -->', env_a)
          if env_b:
              result = result.replace('<!-- 17d5a7795fe7df28d99b48ff15b83a95379983 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
